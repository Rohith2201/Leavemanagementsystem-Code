<div class="allocate-leaves-container">
  <div class="card">
    <h2>Allocate Leaves to Employees</h2>
    
    <form [formGroup]="allocateForm" (ngSubmit)="onAllocate()" class="form-group">
      <div class="form-item">
        <label for="employeeId">Select Employee:</label>
        <select id="employeeId" formControlName="employeeId" class="form-control">
          <option value="" disabled selected>Choose an employee</option>
          <option *ngFor="let emp of employees" [value]="emp.id">
            {{ emp.name }} (Current: {{ emp.leaveBalance }} days)
          </option>
        </select>
      </div>

      <div class="form-item">
        <label for="leaveBalance">Number of Leaves:</label>
        <input 
          type="number" 
          id="leaveBalance" 
          formControlName="leaveBalance" 
          class="form-control"
          min="1"
          max="365"
          placeholder="Enter number of leave days"
        >
      </div>

      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="loading || allocateForm.invalid"
      >
        {{ loading ? 'Allocating...' : 'Allocate Leaves' }}
      </button>
    </form>

    <div *ngIf="successMessage" class="alert alert-success">
      ✓ {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      ✗ {{ errorMessage }}
    </div>

    <div class="employees-list">
      <h3>Current Leave Status</h3>
      <table class="table">
        <thead>
          <tr>
            <th>Employee Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Leave Balance</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let emp of employees">
            <td>{{ emp.name }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.role }}</td>
            <td>
              <span class="badge" 
                    [class.badge-success]="emp.leaveBalance > 10" 
                    [class.badge-warning]="emp.leaveBalance <= 10">
                {{ emp.leaveBalance }} days
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
